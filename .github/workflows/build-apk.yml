name: Build YoungMakers Coding APK

# Manual trigger only: Actions tab -> "Build YoungMakers Coding APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleCatroidDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YoungMakersCoding-debug-apk
          path: catroid/build/outputs/apk/**/*.apk
